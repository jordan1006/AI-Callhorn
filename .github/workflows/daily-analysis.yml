name: Daily Market Analysis

on:
  schedule:
    # 每天早上 8:30 台灣時間
    - cron: '30 0 * * *'
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run market analysis
        env:
          TWITTER_BEARER_TOKEN: ${{ secrets.TWITTER_BEARER_TOKEN }}
        run: python -m src.transmission_chain.dynamic_updater

      - name: Generate report
        run: |
          python -c "
          from src.inverse_engine.script_generator import ScriptGenerator
          from src.personalizer.portfolio_impact import PortfolioImpactAnalyzer
          import json

          # 簡易市場數據
          market_data = {
              'index': {'加權指數': {'change': 0}, 'Nasdaq': {'change': 0}},
              'focus': ['定期執行市場分析'],
              'recommendations': ['請參考最新市場數據']
          }

          generator = ScriptGenerator()
          script = generator.generate_script(market_data)

          with open('DAILY_REPORT.md', 'w') as f:
              f.write('# 每日市場分析報告\\n\\n')
              f.write(script)
              f.write('\\n\\n---\\nGenerated by Financial-Inverse-Engine')
          "

      - name: Commit report
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: Daily market report"
          file_pattern: "DAILY_REPORT.md"

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: daily-report
          path: DAILY_REPORT.md
